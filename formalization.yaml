# Metadata for the explicitly conditional Palomar endpoints.
# The original manuscript-facing declarations retain their disclosed admissions.
version: v0.4
project:
  name: "Ramanujan-type congruences for the smallest parts function, conditional on literature inputs"
  description: >-
    This development formalizes the exclusion of noncanonical prime-modulus
    Ramanujan-type congruences for Andrews' smallest-parts function, relative
    to explicit analytic, arithmetic, and geometric inputs. Under those
    inputs, a congruence spt(p*n+b) = 0 modulo p for every nonnegative n,
    with p prime, p at least five, and 0 <= b < p, forces 24*b = 1 modulo p.
    With canonical-classification and Andrews-congruence inputs, the
    conditional classification holds for every prime: the only pairs are
    (5,4), (7,5), and (13,6). The submitted endpoints use explicit
    hypotheses, including E_(p-1) congruent to 1 and E_(p+1) congruent to E_2.
    The original manuscript-facing declarations rely on
    admitted literature statements and are not unconditional kernel-checked
    proofs of the classification.
  authors:
    - Larry Rolen
  responsible_maintainers:
    - Larry Rolen
  license: MIT
sources:
  - title: "Ramanujan-type congruences for the smallest parts function"
    authors:
      - Larry Rolen
    id: "https://arxiv.org/abs/2611.04178v1"
    type: paper
    location: "Theorem 1.1 and Corollary 1.2, with supporting arguments"
    relationship: formalizes
    note: >-
      The proposed registration concerns the new Palomar conditional exports.
      ASSUMPTIONS.md records the named literature inputs and qualifications.
  - title: "Class polynomial obstructions to canonical congruences for the smallest parts function"
    authors:
      - Larry Rolen
    id: "https://arxiv.org/abs/2610.27145v1"
    type: paper
    location: "Theorem 1.1"
    relationship: background
    note: >-
      Canonical necessity is an external premise for the full classification;
      this entry does not independently verify that premise.
