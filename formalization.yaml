  msc2020:
    - 11P83
    - 11F37
status:
  scope: >-
    Endpoints: SptClassification.Palomar.conditional_noncanonical_exclusion
    and SptClassification.Palomar.conditional_simple_congruence_classification.
    The repository records 62 literature admissions in the main library;
    the complete repository snapshot contains an additional duplicate
    admission in SPT_noncanonical/EffectiveCharacterDiscriminant.lean.
    The original conditional endpoints additionally depend on two admitted
    Eisenstein-series congruences. The Palomar endpoints make those two
    statements explicit hypotheses and substitute them into the existing
    proof terms. The upgraded Solution builds and its axiom audit contains only propext,
    Classical.choice, and Quot.sound. The local statement and reachable-definition
    comparison passes. The full Palomar workflow report for
    the submitted commit records the independent verification result.
automation:
  methods:
    - method: autonomous
      framework: AxiomProver
      tool_setup: "The paper and repository attribute the Lean formalization to AxiomProver."
    - method: agent
      framework: Codex
      tool_setup: "Lean upgrade, module-system compatibility fixes, standalone statement preparation, lifting two admitted literature facts into explicit hypotheses, and kernel axiom audits."
  notes: >-
    Model versions, compute budgets, and prompt logs for AxiomProver have not
    been supplied. The paper acknowledges Connor Olson and Ken Ono for
    assistance with autoformalization.
fidelity:
  divergences: >-
    The endpoints retain EisensteinCongruenceInputs,
    CharacterIntervalInput, ConstantTermInputs,
    ProgressionInputs, CharacterObstructionInputFamily, and, for the full
    classification, CanonicalInputs as explicit premises. Their definitions
    are exposed in the Challenge. The selected conditional endpoints have
    no sorryAx dependency in the local Lean axiom audit.
review:
  status: unchecked
  notes: >-
    Codex inspected repository structure, theorem signatures, and the
    assumption register. This is not a proof or alignment certification.
    Any prior human review of the formalization has not been established.
