name = "sptClassification"
defaultTargets = ["SptClassification"]
fixedToolchain = true
platformIndependent = true
precompileModules = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.34.0"

[[lean_lib]]
name = "SptClassification"
# Include the root and every library module.
globs = ["SptClassification.*"]
leanOptions = { autoImplicit = false, weak.linter.mathlibStandardSet = true }
